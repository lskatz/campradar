[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campradar"
version = "0.2.0"
description = "Track which school-break camps exist, and which ones are new."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lee Katz" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned to a minor range: pytest-tap tracks pytest's plugin API and has
    # broken across major pytest releases before.
    "pytest-tap>=3.4,<4",
    "ruff>=0.5",
]

[project.scripts]
campradar = "campradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests import the sibling conftest directly, which ruff reads as first-party
# confusion, and assert-heavy test bodies trip a few opinionated rules.
"tests/*" = ["E501"]
