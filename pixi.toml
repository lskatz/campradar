[workspace]
authors = ["Lee Katz <lskatz@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "campradar"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "PYTHONPATH=src python3 -m pytest -q"
lint = "ruff check src tests"
fmt = "ruff check src tests --fix"

[dependencies]
pydantic = ">=2.6"
httpx = ">=0.27"
beautifulsoup4 = ">=4.12"
pyyaml = ">=6.0"
pytest = ">=9.1.1,<10"
pip = ">=26.1.2,<27"
ruff = ">=0.16.0,<0.17"
