# Source registry.
#
# Adding a source is normally a change to this file alone. Before writing any
# code for a new provider, run:
#
#     campradar probe https://their-site.example/camps
#
# If that reports usable JSON-LD, the generic `jsonld` adapter will handle it
# and you only need an entry here. Only write a bespoke adapter when probe
# comes back empty. See docs/adding-a-source.md.
#
# Order matters: when the same session is reachable through two sources, the
# one listed first wins. Put provider sites above aggregators, since providers
# are authoritative about their own prices and dates.
#
# `enabled: false` retires a source without deleting the knowledge of it —
# useful when a site is mid-redesign and the adapter is temporarily broken.

providers:
  - slug: fernbank-science-center
    name: Fernbank Science Center
    homepage: https://www.fernbank.edu/
    locality: Druid Hills

  - slug: dunwoody-nature-center
    name: Dunwoody Nature Center
    homepage: https://dunwoodynature.org/
    locality: Dunwoody

  - slug: callanwolde
    name: Callanwolde Fine Arts Center
    homepage: https://callanwolde.org/
    locality: Druid Hills

  - slug: decatur-active-living
    name: City of Decatur Active Living
    homepage: https://www.decaturga.com/activeliving
    locality: Decatur

  - slug: dekalb-county-rec
    name: DeKalb County Recreation, Parks & Cultural Affairs
    homepage: https://www.dekalbcountyga.gov/parks-and-recreation
    locality: DeKalb County

  - slug: marcus-jcc
    name: Marcus Jewish Community Center of Atlanta
    homepage: https://www.atlantajcc.org/
    locality: Dunwoody

  - slug: zoo-atlanta
    name: Zoo Atlanta
    homepage: https://zooatlanta.org/
    locality: Grant Park

  - slug: atlanta-botanical-garden
    name: Atlanta Botanical Garden
    homepage: https://atlantabg.org/
    locality: Midtown

  # Not a real organisation. Backs the example source below; see the comment
  # at the top of site/example-camps.html.
  - slug: example-collective
    name: Example Nature & Arts Collective (fixture)
    homepage: https://lskatz.github.io/campradar/example-camps.html
    locality: Nowhere

sources:
  # --- provider sites -----------------------------------------------------
  # These URLs are placeholders and deliberately disabled. Confirm each one
  # with `campradar probe` and check the site's robots.txt before enabling.

  - id: tucker-rec
    provider_slug: tucker-rec
    adapter: jsonld
    enabled: true
    urls:
      - https://tucker.recdesk.com/Community/Program?category=3

  - id: dekalb-county
    provider_slug: dekalb-county
    adapter: jsonld
    enabled: true
    urls:
      - https://anc.apm.activecommunities.com/dekalbcountyrecreation/activity/search

  - id: dunwoody-nature-center-camps
    provider_slug: dunwoody-nature-center
    adapter: jsonld
    enabled: true
    urls:
      - https://dunwoodynature.org/camps/

  - id: callanwolde-camps
    provider_slug: callanwolde
    adapter: jsonld
    enabled: true
    urls:
      - https://callanwolde.org/camps/

  - id: zoo-atlanta-camps
    provider_slug: zoo-atlanta
    adapter: jsonld
    enabled: true
    urls:
      - https://zooatlanta.org/programs/camps/

  # --- example ------------------------------------------------------------
  # Nine invented camps, served from this repo's own GitHub Pages deployment.
  # Enabled so that a fresh clone gets a dashboard with something on it, and
  # so that an empty dashboard is diagnostic: if these show up and nothing
  # else does, the providers changed rather than the pipeline breaking.
  #
  # Listed last so a real provider always wins a duplicate-key collision.
  # Retire with `enabled: false` once enough real sources work; keep the file.

  - id: example-camps
    provider_slug: example-collective
    adapter: jsonld
    enabled: true
    urls:
      - https://lskatz.github.io/campradar/example-camps.html
