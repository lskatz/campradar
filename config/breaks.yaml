# DeKalb County School District break windows.
#
# Maintained by hand, on purpose. The district publishes its calendar at
#   https://www.dekalbschoolsga.org/official-school-calendars
# as a flat image with no PDF, no alt text and no machine-readable feed, so
# OCR would be fragile in exchange for saving about five minutes of typing a
# year. Automating this would be the wrong place to spend engineering effort.
#
# Check the individual school calendar too — schools occasionally add days the
# district calendar doesn't show.
#
# VERIFY THESE DATES against the official calendar before relying on them.
# The entries below are illustrative placeholders for the 2026-2027 year.

breaks:
  - name: Fall Break
    start: 2026-09-21
    end: 2026-09-25

  - name: Thanksgiving Break
    start: 2026-11-23
    end: 2026-11-27

  - name: Winter Break
    start: 2026-12-21
    end: 2027-01-05

  - name: Winter Holiday (MLK)
    start: 2027-01-18
    end: 2027-01-18

  - name: Mid-Winter Break
    start: 2027-02-15
    end: 2027-02-19

  - name: Spring Break
    start: 2027-04-05
    end: 2027-04-09

  - name: Summer
    start: 2027-05-27
    end: 2027-08-03
