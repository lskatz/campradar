# Scheduled camp refresh and site deploy.
#
# This workflow never writes to the repository. It has no commit step and no
# `contents: write` permission — the only things it produces are the deployed
# Pages site and artifacts you can download for debugging.
#
# Change tracking still works. `first_seen` lives inside the published
# sessions.json, so each run hydrates prior state from the live site via
# --previous-url. The deployment is the state store. This is also self-healing:
# whatever is currently live is the source of truth, so a lost cache or a
# re-created repo converges on the next run instead of needing a reset.
#
# Cadence is seasonal on purpose. Metro Atlanta camps open registration between
# roughly September and February and sell out fast, so that window gets a
# weekly check; the rest of the year monthly is plenty and keeps us off small
# providers' servers.

name: Refresh camps

on:
  schedule:
    # Mondays 11:00 UTC (07:00 ET) — results waiting on Monday morning.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "site/**"

# Deliberately minimal: read the code, publish Pages. No write access to
# repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: camp-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # Before fetching: a broken parser must not be allowed to publish
        # garbage over a working site.
        run: pytest -q

      # Persists the conditional-request cache between runs so unchanged
      # provider pages transfer nothing. Purely an optimisation — a cache miss
      # costs bandwidth, never correctness.
      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: fetch-cache-${{ github.run_id }}
          restore-keys: fetch-cache-

      - name: Refresh
        env:
          # The currently deployed data file, used as prior state. Derived from
          # the repo name, so a fork or a rename needs no edit here.
          PREVIOUS_URL: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/assets/data/sessions.json
        run: |
          set -o pipefail
          campradar refresh --verbose --previous-url "$PREVIOUS_URL" 2>&1 | tee refresh.log

      - name: Summarise run
        if: always()
        # Shown on the workflow run page, so you can see what happened without
        # downloading anything.
        run: |
          {
            echo "## Camp Radar refresh"
            echo
            echo '```'
            grep -E "^(Sources|Sessions|Changes|  NEW|  failed)" refresh.log || echo "no summary lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ github.run_number }}
          # The log plus the exact data being published, for diffing against an
          # earlier run when something looks wrong.
          path: |
            refresh.log
            site/assets/data/sessions.json
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
